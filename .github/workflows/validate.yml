name: Validate package

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate files and metadata
        run: |
          python -m py_compile scripts/validate-package.py scripts/package-release.py evals/score-results.py
          python scripts/validate-package.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Build deterministic release archives
        run: python scripts/package-release.py --output /tmp/humanizer-dist

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify Agent Skills discovery
        run: npx --yes skills@1.5.20 add . --list

      - name: Validate Claude Code plugin
        run: npx --yes @anthropic-ai/claude-code plugin validate .
