name: Execute final audit fixes

on:
  push:
    branches:
      - agent/final-audit-fixes

permissions:
  contents: write

jobs:
  execute:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/final-audit-fixes
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Extract and apply corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/apply-final-audit-fixes.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY", start)
          lines = source[start:end].splitlines()
          code = "\n".join(line[10:] if line.startswith("          ") else line for line in lines) + "\n"
          Path('/tmp/apply_final_audit_fixes.py').write_text(code, encoding='utf-8')
          PY
          python /tmp/apply_final_audit_fixes.py
          rm .github/workflows/apply-final-audit-fixes.yml
          rm .github/workflows/execute-final-audit-fixes.yml

      - name: Validate corrected repository
        run: |
          python scripts/validate-package.py
          python -m unittest discover -s tests -v

      - name: Commit corrected state
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply final audit fixes"
          git push origin HEAD:agent/final-audit-fixes
